<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6750A4">
    <title>Iron Log - Smart Coach Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="topbar">
    <div class="timer-row">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div style="display:flex; gap:6px;">
            <button class="btn-pill" onclick="startTimer(60)">60s</button>
            <button class="btn-pill" onclick="startTimer(90)">90s</button>
            <button class="btn-pill" onclick="startTimer(120)">120s</button>
        </div>
    </div>
    <div class="stopwatch-row" id="stopwatchRow" style="display:none;">
        <span class="material-symbols-outlined" style="font-size:16px; color:var(--primary);">timer</span>
        <div class="stopwatch-display" id="stopwatchDisplay">00:00</div>
        <span class="stopwatch-label">SESIÓN ACTIVA</span>
    </div>
</div>

<div class="main">
    <div id="rutinaPage" class="page active">
        <div id="groupsView">
            <div class="header-row">
                <h2><span class="material-symbols-outlined">library_books</span> Biblioteca</h2>
                <div id="exerciseCounter" class="counter-badge">0</div>
            </div>
            <div class="group-grid" id="groupGrid"></div>
        </div>
        <div id="exerciseView" style="display:none;">
            <button onclick="backToGroups()" style="border:none; background:none; color:var(--primary); font-weight:bold; margin-bottom:15px; display:flex; align-items:center; gap:8px;">
                <span class="material-symbols-outlined">arrow_back</span> Atrás
            </button>
            <h3 id="selectedGroupName"></h3>
            <p id="groupAdvice" style="font-size: 12px; color: var(--text2); margin-top: -10px; margin-bottom: 15px; font-style: italic;"></p>
            <div id="exerciseList"></div>
        </div>
    </div>

    <div id="hoyPage" class="page">
        <div class="header-row">
            <h2><span class="material-symbols-outlined">fitness_center</span> Hoy</h2>
            <button onclick="clearHoy()" style="color:var(--danger); border:none; background:none; font-weight:bold;">Limpiar</button>
        </div>
        <div class="coach-card" id="coachPanel">
            <div style="font-weight: bold; font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; gap: 5px;">
                <span class="material-symbols-outlined" style="font-size: 18px; color: var(--primary);">psychology</span> Coach Inteligente
            </div>
            <div id="coachMessage" style="font-size: 12px; line-height: 1.4;">...</div>
            <div class="coach-status" id="coachTags"></div>
        </div>
        <div id="todayList"></div>
        <button class="btn-action" onclick="finalizarSesion()">FINALIZAR SESIÓN</button>
    </div>

    <div id="semanaPage" class="page">
        <div class="header-row">
            <h2><span class="material-symbols-outlined">calendar_view_week</span> Semana</h2>
            <div style="display:flex; gap:8px;">
                <button onclick="limpiarPlantillas()" style="color:var(--danger); border:none; background:none; font-size:11px; font-weight:bold;">RESETEAR</button>
                <button onclick="generarRutinaInteligente()" style="background:var(--primary); color:white; border:none; padding:8px 12px; border-radius:10px; font-size:11px; font-weight:bold;">CARGAR HOY</button>
            </div>
        </div>
        <div id="weekPlanner"></div>
    </div>

    <div id="historialPage" class="page">
        <div class="header-row">
            <h2><span class="material-symbols-outlined">history</span> Log</h2>
        </div>

        <div id="statsDashboard" class="coach-card" style="background: var(--primary-light); border: none; margin-bottom: 20px;">
            <div style="font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 5px;">
                <span class="material-symbols-outlined">insights</span> Rendimiento
            </div>
            <div id="statsContent" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                </div>
        </div>

        <div id="calendarContainer"></div>
        <div id="dayModal" class="day-modal" style="display:none;" onclick="closeDayModal(this,event)">
            <div class="day-modal-sheet">
                <div class="day-modal-header">
                    <span id="dayModalTitle" class="day-modal-title"></span>
                    <button class="day-modal-close" onclick="closeDayModal()">✕</button>
                </div>
                <div id="dayModalBody"></div>
            </div>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-btn active" id="btn-rutina" onclick="showPage('rutinaPage', this)">
        <span class="material-symbols-outlined">format_list_bulleted</span>Biblioteca
    </button>
    <button class="nav-btn" id="btn-hoy" onclick="showPage('hoyPage', this)">
        <span class="material-symbols-outlined">fitness_center</span>Hoy
    </button>
    <button class="nav-btn" id="btn-semana" onclick="showPage('semanaPage', this)">
        <span class="material-symbols-outlined">calendar_month</span>Semana
    </button>
    <button class="nav-btn" id="btn-historial" onclick="showPage('historialPage', this)">
        <span class="material-symbols-outlined">history</span>Log
    </button>
</nav>

<script src="js/app.js"></script>

</body>
</html>
